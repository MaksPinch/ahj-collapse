<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collapse</title>
  </head>
  <body>
    <main class="page">
      <h1>Collapse</h1>
      <button class="collapse-button" type="button" aria-controls="details" aria-expanded="false">
        Collapse
      </button>
      <div class="collapse" id="details" aria-hidden="true">
        <div class="collapse-inner">
          <p class="collapse-text">
            Это содержимое блока. Нажмите кнопку ещё раз, чтобы скрыть его.
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
